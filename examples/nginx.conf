# Replace the domain and certificate paths before installing this example.
server {
    listen 80;
    server_name checkin.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name checkin.example.com;
    ssl_certificate /etc/letsencrypt/live/checkin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkin.example.com/privkey.pem;
    auth_basic "Private WeChat Desktop";
    auth_basic_user_file /etc/wechat-web/htpasswd;
    add_header Cache-Control "no-store" always;
    location = / {
        return 302 /vnc.html?autoconnect=true&resize=scale&reconnect=true&reconnect_delay=2000&path=websockify;
    }
    location /websockify {
        if ($http_origin != "https://checkin.example.com") { return 403; }
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:6080;
        proxy_set_header Host $host;
    }
}
